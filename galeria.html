<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería – BR Confecciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: #1b1410; color: #fff; line-height: 1.6; }

    /* Encabezado */
    .info-box { text-align: center; padding: 40px 20px; background: rgba(20, 15, 12, 0.9); border-bottom: 1px solid #3a2e25; }
    h1 { font-family: 'Cormorant Garamond', serif; color: #f5e6cc; font-size: 2.8rem; margin: 0; }
    
    /* Botones de Filtro */
    .filter-container { margin: 20px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .filter-btn { 
      background: transparent; border: 1px solid #4a3b2f; color: #d4c5a8; 
      padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s;
      text-transform: capitalize; font-size: 0.9rem;
    }
    .filter-btn.active, .filter-btn:hover { background: #d4af37; color: #1b1410; border-color: #d4af37; }

    /* Grilla */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .gallery-item { 
      height: 350px; background: #1f1813; border-radius: 10px; overflow: hidden; 
      border: 1px solid #3a2e25; cursor: pointer; position: relative;
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .gallery-item:hover img { transform: scale(1.1); }
    .caption { 
      position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); 
      color: #f5e6cc; padding: 15px; text-align: center; opacity: 0; transition: 0.3s; 
    }
    .gallery-item:hover .caption { opacity: 1; }

    /* Lightbox */
    #lightbox { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); text-align: center; }
    #lightbox img { max-width: 90%; max-height: 80%; margin-top: 50px; border: 1px solid #d4af37; border-radius: 8px; }
    .close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; cursor: pointer; }

    footer { text-align: center; padding: 40px; color: #666; font-size: 0.8rem; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="info-box">
    <h1>Galería de Creaciones</h1>
    <div id="filtros" class="filter-container">
        <button class="filter-btn active" onclick="filtrar('todos')">Todos</button>
        </div>
    <a href="index.html" style="color: #d4c5a8; text-decoration: none; font-size: 0.8rem;">← Volver al Inicio</a>
  </div>

  <div id="grid-galeria" class="grid"></div>

  <div id="lightbox" onclick="this.style.display='none'">
    <span class="close">×</span>
    <img id="lightbox-img">
    <p id="lightbox-txt" style="color: #f5e6cc; font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; margin-top: 15px;"></p>
  </div>

<script>
  const SHEET_ID = '1fczLyhidq7xLFh6LwONnqn_uGoAqujCSGzTRfgKwxrA';
  const GID_GALERIA = '1717798500';
  const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_GALERIA}&cache=update`;

  let todosLosTrabajos = [];

  async function cargarGaleria() {
    try {
      const res = await fetch(URL);
      const csv = await res.text();
      const filas = csv.split(/\r?\n/).slice(1);
      const contenedor = document.getElementById('grid-galeria');
      const filtroContainer = document.getElementById('filtros');
      let categorias = new Set();

      filas.forEach(linea => {
        const c = linea.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (c.length < 3) return;

        const titulo = c[0].replace(/"/g, '');
        const desc   = c[1].replace(/"/g, '');
        let   imgRaw = c[2].replace(/"/g, '').trim();
        const cat    = c[3] ? c[3].replace(/"/g, '').trim().toLowerCase() : 'otros';

        if (cat !== 'otros') categorias.add(cat);

        let finalImg = imgRaw;
        if (imgRaw.includes('drive.google.com')) {
          let id = imgRaw.includes('id=') ? imgRaw.split('id=')[1].split('&')[0] : imgRaw.split('/d/')[1].split('/')[0];
          finalImg = `https://lh3.googleusercontent.com/u/0/d/${id}`;
        }

        todosLosTrabajos.push({ titulo, desc, img: finalImg, cat });
      });

      // Crear botones de categorías
      categorias.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.innerText = cat;
        btn.onclick = (e) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            filtrar(cat);
        };
        filtroContainer.appendChild(btn);
      });

      mostrarGrilla(todosLosTrabajos);
    } catch (e) { console.error(e); }
  }

  function mostrarGrilla(lista) {
    const contenedor = document.getElementById('grid-galeria');
    contenedor.innerHTML = lista.map(t => `
      <div class="gallery-item" onclick="abrirLB('${t.img}', '${t.titulo}')">
        <img src="${t.img}" loading="lazy">
        <div class="caption"><strong>${t.titulo}</strong><br>${t.desc}</div>
      </div>
    `).join('');
  }

  function filtrar(cat) {
    if (cat === 'todos') {
      mostrarGrilla(todosLosTrabajos);
    } else {
      const filtrados = todosLosTrabajos.filter(t => t.cat === cat);
      mostrarGrilla(filtrados);
    }
  }

  function abrirLB(src, txt) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-txt').innerText = txt;
    document.getElementById('lightbox').style.display = 'block';
  }

  cargarGaleria();
</script>
</body>
</html>
