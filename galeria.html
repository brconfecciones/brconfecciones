<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería – BR Confecciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: #1b1410; color: #fff; line-height: 1.6; }

    /* Encabezado */
    .info-box { text-align: center; padding: 60px 20px; background: rgba(20, 15, 12, 0.9); border-bottom: 1px solid #3a2e25; }
    h1 { font-family: 'Cormorant Garamond', serif; color: #f5e6cc; font-size: 2.8rem; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    p.subtitle { font-size: 1.1rem; color: #d4c5a8; margin: 10px 0 20px; }
    .btn-volver { display: inline-block; color: #d4c5a8; text-decoration: none; padding: 10px 25px; border: 1px solid #3a2e25; border-radius: 25px; transition: 0.3s; font-size: 0.9rem; }
    .btn-volver:hover { background: rgba(212, 175, 55, 0.1); border-color: #d4c5a8; color: #fff; }

    /* Grilla de Galería */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
    
    .gallery-item { 
      position: relative; 
      height: 400px; 
      background: #1f1813; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #3a2e25; 
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
    
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
    .gallery-item:hover img { transform: scale(1.1); filter: brightness(1.1); }

    /* Texto sobre la foto al pasar el mouse */
    .caption { 
      position: absolute; bottom: 0; left: 0; width: 100%; 
      background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
      color: #f5e6cc; padding: 20px; text-align: center; 
      opacity: 0; transition: 0.3s; box-sizing: border-box;
    }
    .gallery-item:hover .caption { opacity: 1; }
    .caption strong { display: block; font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin-bottom: 5px; }

    /* Lightbox (Vista ampliada) */
    #lightbox { 
      display: none; position: fixed; z-index: 1000; top: 0; left: 0; 
      width: 100%; height: 100%; background: rgba(0,0,0,0.96); 
      cursor: zoom-out; animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    #lightbox img { 
      max-width: 90%; max-height: 80vh; position: absolute; 
      top: 50%; left: 50%; transform: translate(-50%, -50%); 
      border: 1px solid #d4af37; border-radius: 8px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }
    #lightbox p { 
      position: absolute; bottom: 5%; width: 100%; text-align: center; 
      color: #f5e6cc; font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; 
    }
    .close { position: absolute; top: 30px; right: 40px; color: #fff; font-size: 50px; font-weight: 200; }

    footer { text-align: center; padding: 60px 20px; color: #666; font-size: 0.9rem; border-top: 1px solid #3a2e25; }
  </style>
</head>
<body>

  <div class="info-box">
    <h1>Galería de Creaciones</h1>
    <p class="subtitle">Cada puntada cuenta una historia... Aquí es donde tu Estilo cobra Vida</p>
    <a href="index.html" class="btn-volver">← Volver al Inicio</a>
  </div>

  <div id="grid-galeria" class="grid">
    <p style="grid-column: 1/-1; text-align: center; color: #d4c5a8;">Buscando tus trabajos en el taller...</p>
  </div>

  <div id="lightbox" onclick="this.style.display='none'">
    <span class="close">&times;</span>
    <img id="lightbox-img" src="">
    <p id="lightbox-txt"></p>
  </div>

  <footer>
    BR Confecciones — Capilla del Monte, Córdoba<br>© 2026.
  </footer>

<script>
  // CONFIGURACIÓN DE TU EXCEL
  const SHEET_ID = '1fczLyhidq7xLFh6LwONnqn_uGoAqujCSGzTRfgKwxrA';
  const GID_GALERIA = '1717798500'; // Tu ID de la hoja de Galería
  
  const URL_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_GALERIA}`;

  async function cargarGaleria() {
    try {
      const respuesta = await fetch(URL_CSV);
      const datosCsv = await respuesta.text();
      // Dividimos por filas y saltamos la primera (títulos)
      const filas = datosCsv.split(/\r?\n/).slice(1);
      const contenedor = document.getElementById('grid-galeria');
      let htmlFinal = '';

      filas.forEach(linea => {
        // Separamos por comas, respetando si hay comas dentro de textos entre comillas
        const c = linea.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (c.length < 3) return;

        const titulo = c[0].replace(/"/g, '').trim();
        const desc   = c[1].replace(/"/g, '').trim();
        let   imgUrl = c[2].replace(/"/g, '').trim();

        // MOTOR INTELIGENTE PARA DRIVE
        let fotoFinal = imgUrl;
        if (imgUrl.includes('drive.google.com') || imgUrl.includes('google.com/file')) {
            let id = '';
            if (imgUrl.includes('id=')) {
                id = imgUrl.split('id=')[1].split('&')[0];
            } else if (imgUrl.includes('/d/')) {
                id = imgUrl.split('/d/')[1].split('/')[0];
            }
            // Formato de carga ultra-rápida de Google
            fotoFinal = `https://lh3.googleusercontent.com/u/0/d/${id}`;
        }

        if (titulo && imgUrl) {
          htmlFinal += `
            <div class="gallery-item" onclick="mostrarFoto('${fotoFinal}', '${titulo}')">
              <img src="${fotoFinal}" alt="${titulo}" loading="lazy">
              <div class="caption">
                <strong>${titulo}</strong>
                <span>${desc}</span>
              </div>
            </div>`;
        }
      });
      
      contenedor.innerHTML = htmlFinal || '<p style="grid-column: 1/-1;">Aún no hay fotos en la galería.</p>';

    } catch (error) {
      console.error("Error cargando galería:", error);
      document.getElementById('grid-galeria').innerHTML = '<p style="grid-column: 1/-1;">Hubo un problema al conectar con el Excel.</p>';
    }
  }

  function mostrarFoto(link, texto) {
    document.getElementById('lightbox-img').src = link;
    document.getElementById('lightbox-txt').innerText = texto;
    document.getElementById('lightbox').style.display = 'block';
  }

  // Arrancamos la carga
  cargarGaleria();
</script>

</body>
</html>
