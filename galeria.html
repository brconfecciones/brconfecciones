<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo – BR Confecciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Montserrat', sans-serif; background: #1b1410; color: #fff; text-align: center; min-height: 100vh; }
    header { padding: 50px 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid #3a2e25; }
    h1 { font-family: 'Cormorant Garamond', serif; color: #f5e6cc; font-size: 2.8rem; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    
    .productos { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
    
    .card { 
      width: 300px; 
      background: rgba(42, 32, 25, 0.9); 
      border: 1px solid #4a3b2f; 
      border-radius: 15px; 
      overflow: hidden; 
      transition: 0.3s; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    
    .card:hover { transform: translateY(-10px); border-color: #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
    
    .card img { 
      width: 100%; 
      height: 380px; 
      object-fit: contain; /* Para que se vea el disfraz entero sin zoom */
      background-color: #140e0a; 
      border-bottom: 1px solid #3a2e25;
    }
    
    .info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .info h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: #f5e6cc; margin: 0 0 10px; }
    .precio { color: #d4af37; font-weight: 600; font-size: 1.4rem; margin: 10px 0; }
    .desc { font-size: 0.95rem; color: #ccc; min-height: 45px; line-height: 1.4; margin-bottom: 15px; }
    
    .btn-wsp { 
      display: block; 
      background: #25d366; 
      color: #fff; 
      text-decoration: none; 
      padding: 14px; 
      border-radius: 30px; 
      font-weight: bold; 
      transition: 0.3s; 
    }
    .btn-wsp:hover { background: #128c7e; transform: scale(1.05); }
    
    .volver { display: inline-block; margin-top: 20px; color: #f5e6cc; text-decoration: none; font-size: 0.9rem; }
    footer { padding: 40px; color: #666; font-size: 0.8rem; }
  </style>
</head>
<body>

<header>
  <h1>Catálogo BR Confecciones</h1>
  <a href="index.html" class="volver">← Volver al Inicio</a>
</header>

<div id="contenedor-productos" class="productos">
  <p>Cargando creaciones...</p>
</div>

<footer>
  BR Confecciones — Capilla del Monte, Córdoba<br>© 2026.
</footer>

<script>
  // Tu ID de planilla (No lo cambies, ya es el tuyo)
  const SHEET_ID = '1fczLyhidq7xLFh6LwONnqn_uGoAqujCSGzTRfgKwxrA';
  // El link al CSV de la Hoja 1 (Catálogo)
  const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

  async function cargarCatalogo() {
    try {
      const respuesta = await fetch(URL);
      const csv = await respuesta.text();
      const filas = csv.split(/\r?\n/).slice(1);
      const contenedor = document.getElementById('contenedor-productos');
      let htmlFinal = '';

      filas.forEach(linea => {
        const c = linea.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (c.length < 5) return;

        const nombre = c[0].replace(/"/g, '').trim();
        const precio = c[1].replace(/"/g, '').trim();
        const desc   = c[2].replace(/"/g, '').trim();
        let   imgRaw = c[3].replace(/"/g, '').trim();
        const estado = c[4].replace(/"/g, '').trim().toLowerCase();

        if (estado === 'activo') {
          let finalImg = '';
          
          // --- MOTOR INTELIGENTE DE DETECCIÓN DE DRIVE ---
          if (imgRaw.includes('drive.google.com') || imgRaw.includes('google.com/file')) {
              let id = '';
              // Caso 1: Tiene "id="
              if (imgRaw.includes('id=')) {
                  id = imgRaw.split('id=')[1].split('&')[0];
              } 
              // Caso 2: Tiene "/d/ID/view"
              else if (imgRaw.includes('/d/')) {
                  id = imgRaw.split('/d/')[1].split('/')[0];
              }
              // Formato de salida optimizado para velocidad
              finalImg = `https://lh3.googleusercontent.com/u/0/d/${id}`;
          } else {
              // Si no es Drive (ej: link de Pinterest o Imgur), lo deja como está
              finalImg = imgRaw;
          }

          htmlFinal += `
            <div class="card">
              <img src="${finalImg}" alt="${nombre}" loading="lazy">
              <div class="info">
                <div>
                  <h3>${nombre}</h3>
                  <p class="desc">${desc}</p>
                </div>
                <div>
                  <p class="precio">$${precio} ARS</p>
                  <a href="https://wa.me/543548584454?text=Hola!%20Me%20interesa:%20${encodeURIComponent(nombre)}" class="btn-wsp" target="_blank">
                    💬 Consultar
                  </a>
                </div>
              </div>
            </div>`;
        }
      });
      contenedor.innerHTML = htmlFinal || '<p>No hay productos activos.</p>';
    } catch (error) {
      contenedor.innerHTML = '<p>Error al conectar con la base de datos.</p>';
    }
  }
  cargarCatalogo();
</script>
</body>
</html>
