<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo – BR Confecciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Montserrat', sans-serif; background: #1b1410; color: #fff; text-align: center; }
    header { padding: 50px 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid #3a2e25; }
    h1 { font-family: 'Cormorant Garamond', serif; color: #f5e6cc; font-size: 2.8rem; margin: 0; }
    .productos { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
    .card { width: 300px; background: rgba(42, 32, 25, 0.9); border: 1px solid #4a3b2f; border-radius: 15px; overflow: hidden; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .card:hover { transform: translateY(-10px); border-color: #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
    .card img { width: 100%; height: 250px; object-fit: cover; border-bottom: 1px solid #3a2e25; }
    .info { padding: 20px; }
    .info h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: #f5e6cc; margin: 0 0 10px; }
    .precio { color: #d4af37; font-weight: 600; font-size: 1.3rem; margin: 10px 0; }
    .desc { font-size: 0.9rem; color: #ccc; min-height: 40px; }
    .btn-wsp { display: block; background: #25d366; color: #fff; text-decoration: none; padding: 12px; border-radius: 30px; font-weight: bold; margin-top: 15px; transition: 0.3s; }
    .btn-wsp:hover { background: #128c7e; transform: scale(1.05); }
    .volver { display: inline-block; margin-top: 20px; color: #f5e6cc; text-decoration: none; font-size: 0.9rem; opacity: 0.8; }
    .volver:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>Catálogo BR Confecciones</h1>
  <a href="index.html" class="volver">← Volver a la página principal</a>
</header>

<div id="contenedor-productos" class="productos">
  <p style="color: #f5e6cc;">Abriendo el taller...</p>
</div>

<script>
  const SHEET_ID = '1fczLyhidq7xLFh6LwONnqn_uGoAqujCSGzTRfgKwxrA';
  const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

  async function cargarCatalogo() {
    try {
      const respuesta = await fetch(URL);
      const csv = await respuesta.text();
      const filas = csv.split(/\r?\n/).slice(1);
      const contenedor = document.getElementById('contenedor-productos');
      let htmlFinal = '';

      filas.forEach(linea => {
        const c = linea.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (c.length < 5) return;

        const nombre = c[0].replace(/"/g, '');
        const precio = c[1].replace(/"/g, '');
        const desc   = c[2].replace(/"/g, '');
        let   imgRaw = c[3].replace(/"/g, '').trim();
        const estado = c[4].replace(/"/g, '').trim().toLowerCase();

        if (estado === 'activo') {
          let finalImg = '';
          
          // --- MOTOR DE DETECCIÓN DE ID ---
          if (imgRaw.includes('drive.google.com')) {
              let id = '';
              if (imgRaw.includes('id=')) {
                  id = imgRaw.split('id=')[1].split('&')[0];
              } else if (imgRaw.includes('/d/')) {
                  id = imgRaw.split('/d/')[1].split('/')[0];
              }
              // Usamos el link que menos falla
              finalImg = `https://lh3.googleusercontent.com/u/0/d/${id}`;
          } else {
              finalImg = imgRaw;
          }

          htmlFinal += `
            <div class="card">
              <img src="${finalImg}" alt="${nombre}" loading="lazy">
              <div class="info">
                <h3>${nombre}</h3>
                <p class="desc">${desc}</p>
                <p class="precio">$${precio} ARS</p>
                <a href="https://wa.me/543548584454?text=Hola!%20Me%20interesa%20${encodeURIComponent(nombre)}" class="btn-wsp">
                  💬 Consultar por WhatsApp
                </a>
              </div>
            </div>`;
        }
      });
      contenedor.innerHTML = htmlFinal || '<p>No hay productos activos.</p>';
    } catch (error) {
      document.getElementById('contenedor-productos').innerHTML = '<p>Error de conexión.</p>';
    }
  }
  cargarCatalogo();
</script>
</body>
</html>
